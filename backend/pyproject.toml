[project]
name = "atlas-backend"
version = "0.1.0"
description = "ATLAS - multi-agent mission execution platform (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    "deepagents>=0.7.38,<0.8",
    "fastapi>=0.163.1,<1",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0,<6",
    "langgraph>=1.2.22,<2",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.14.3,<3",
    "sqlalchemy>=2.1.8,<2.2",
    "temporalio>=1.36.1,<2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atlas"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["temporal: requires Temporal test server download"]
